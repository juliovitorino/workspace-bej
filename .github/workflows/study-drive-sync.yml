name: BEJ CI - qualidade e regressao

# Runs on every PR to master. No deployments, paid runners or uploaded artifacts.
on:
  pull_request:
    branches:
      - master

# Read-only access; CI never merges or modifies the repository.
permissions:
  contents: read

# Avoid spending runner time on obsolete revisions of the same PR.
concurrency:
  group: bej-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-and-regression:
    name: BEJ CI / tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate translated content and intentions
        run: |
          npm run validate:hashmaps:v4
          npm run validate:i18n
      - name: Test study, dashboard and Drive Sync (including WRG)
        run: |
          node scripts/test-study-notifications.mjs
          node scripts/test-study-reset.mjs
          node scripts/test-study-events.mjs
          node scripts/test-study-locks.mjs
          node scripts/test-study-dashboard.mjs
          node scripts/test-extra-activities.mjs
          node scripts/test-study-multitab.mjs
          npm run test:sync
      - name: Test flashcards and walking mode
        run: npm run test:flashcards
      - name: Test Small Talk and author collections
        run: |
          npm run test:smalltalk
          npm run test:collection
      - name: Test training, backup, maintenance and donations
        run: |
          npm run test:training-examples
          npm run test:backup
          npm run test:maintenance
          npm run test:donation
      - name: TypeScript check and production build
        run: npm run build
