name: BEJ CI - build e sincronizacao

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: bej-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-and-regression:
    name: BEJ CI / tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate V4 intention catalogs and translations
        run: |
          npm run validate:hashmaps:v4
          npm run validate:i18n
      - name: Test Google Drive Sync and WRG
        run: |
          npm run test:sync
          npm run test:wrg-scroll
      - name: TypeScript check and production build
        run: npm run build
