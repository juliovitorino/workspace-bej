name: BEJ Study Drive Sync regression

on:
  push:
    branches:
      - bugfix/sync-1125
      - bugfix/sync-1208
      - bugfix/sync-1232
  pull_request:
    paths:
      - 'src/features/study/studyDriveSync.ts'
      - 'src/features/study/studyStorage.ts'
      - 'src/features/study/StudyDriveSync.tsx'
      - 'src/features/study/StudyGoogleDrivePanel.tsx'
      - 'scripts/test-study-drive-sync.mjs'
      - 'package.json'

jobs:
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:sync
      - run: npm run build
