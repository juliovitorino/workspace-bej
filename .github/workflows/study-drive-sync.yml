name: BEJ CI - validacoes, testes e build

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: bej-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validations:
    name: "01 - Validacoes"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate V4 intention catalogs
        run: npm run validate:hashmaps:v4
      - name: Validate translations
        run: npm run validate:i18n

  tests:
    name: "02 - Testes"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Google Drive Sync
        run: npm run test:sync
      - name: Test WRG scrolling
        run: npm run test:wrg-scroll

  build:
    name: "03 - Build"
    needs: [validations, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check and production build
        run: npm run build

  ci-success:
    name: "04 - CI Aprovado"
    needs: [validations, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm all CI stages passed
        run: echo "BEJ CI aprovado!"

  awaiting-merge:
    name: "05 - Aguardando merge na master"
    needs: [ci-success]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Informar proxima acao manual
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "CI aprovado. O merge na master depende de aprovacao manual."
          {
            echo "## 05 - Aguardando merge na master"
            echo ""
            echo "Todas as verificacoes do CI foram aprovadas."
            echo "O merge na master depende de revisao e acao manual."
            echo ""
            echo "Pull request: ${PR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
