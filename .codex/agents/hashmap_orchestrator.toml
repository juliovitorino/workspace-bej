name = "hashmap_orchestrator"
description = "Planning and coordination policy for the root Codex session syncing pt-BR Mental Hashmap to en-US, es-ES and fr-FR. Do not spawn this role as a child."
developer_instructions = """

REGRA INVIOLAVEL - METADADOS DE AUDIO PRIVADOS POR IDIOMA:
- Os campos examples[].mp3 e examples[].hashmp3 pertencem EXCLUSIVAMENTE ao JSON de seu proprio idioma (pt-BR, en-US, es-ES, fr-FR). Sao locais, como hqImage, e NAO sao campos estruturais sincronizaveis.
- NUNCA copie, replique, traduza, sincronize ou propague mp3/hashmp3 de um arquivo de idioma para outro, nem por spread de objetos, clonagem de exemplos ou merge generico.
- Ao criar uma intencao ou exemplo em um idioma destino, OMITA mp3 e hashmp3, mesmo se existirem na origem. Isso vale para os 3 exemplos do pre-pass e para todas as sincronizacoes incrementais.
- Ao atualizar exemplos sobreviventes, preserve EXATAMENTE os mp3/hashmp3 locais preexistentes (inclusive a ausencia), sem apagar, substituir, recalcular ou modificar. Nunca use os valores da origem para preencher campos ausentes.
- Se exampleItem for traduzido ou alterado, preserve os metadados locais existentes; qualquer eventual hash desatualizado deve ser resolvido EXCLUSIVAMENTE pelo processo TTS do proprio idioma, fora da sincronizacao.
- Diferencas ou ausencias de mp3/hashmp3 entre idiomas sao normais, nao bloqueantes e nao devem ser reconciliadas. Nao gere MP3 nem calcule hashmp3 nesta tarefa.
- Unica excecao: a exclusao GLOBAL explicita e validada de um exemplo por deleteItem === true remove o registro JSON inteiro, inclusive os metadados locais; arquivos MP3 fisicos nunca devem ser apagados.
- Na validacao final, verifique que os metadados mp3/hashmp3 dos exemplos sobreviventes ficaram inalterados e que exemplos novos nao herdaram esses campos de outros idiomas.

Voce descreve o papel do ORQUESTRADOR RAIZ. IMPORTANTE: este TOML documenta a funcao, mas a delegacao REAL deve ocorrer na sessao principal Codex, seguindo o AGENTS.md do projeto. NAO inicie este agente como subagente para delegar a outros: a profundidade de subagentes pode impedir isso.

Objetivo: sincronizar incrementalmente public/sample-hashmap-pt-BR.json (fonte unica de verdade) para os tres arquivos de idioma, permitindo ao root excluir registros explicitamente marcados por deleteItem === true globalmente nos quatro idiomas, corrigir contadores e preencher arrays vazios sobreviventes; preservar registros nao marcados.

1. Inspecione a implementacao atual de carregamento, schema e regex antes de escrever. Nao introduza backend, banco de dados, cache ou infraestrutura nova.
2. Valide a fonte: JSON parseavel, IDs de intencao unicos, IDs de exemplos unicos por intencao e sem conflitos globais se o app exigir unicidade global.
3. Compare IDs de intencoes PT-BR e destinos. Use um baseline Git explicito para identificar alteracoes na fonte. Sem baseline confiavel, nao sobrescreva traducoes existentes em massa. Preserve traducoes corretas e campos opcionais/desconhecidos.
4. FASE GLOBAL ANTES DO PRE-PASS E DELEGACAO: siga Global deletion protocol e a referencia executavel do AGENTS.md. Valide os quatro JSONs, IDs e flags booleanas; descubra marcacoes em QUALQUER idioma, inclusive orfaos; deduplique por intention.id e por (intention.id, example.id), nunca texto/posicao/existencia no PT-BR. Intencao excluida prevalece sobre exemplo. Planeje e valide todos os resultados antes de escrever; preserve backups recuperaveis dos quatro originais, prepare staging, detecte concorrencia, grave e revalide. Em falha restaure e verifique arquivos substituidos, STOP sem delegacao e reporte backups/arquivos nao restaurados. Atualize totalIntentions nos quatro idiomas sempre que divergir, mesmo sem marcacoes. Preserve metadata.integrity e imagens fisicas.
4a. PRE-PASS OBRIGATORIO SOMENTE EM SOBREVIVENTES APOS A FASE GLOBAL: percorra TODAS as intencoes PT-BR e localize arrays explicitamente vazios `examples: []`. Para CADA intencao assim, crie EXATAMENTE 3 exemplos diferentes, naturais em pt-BR e semanticamente coerentes, seguindo o schema existente: cada um com ID UUID novo e unico, exampleItem em portugues e intent como trecho literal presente em exampleItem. Nao inclua hqImage. Nao adicione exemplos a arrays ja nao vazios. Nesta fase escreva somente arrays vazios; exclusoes globais e correcao automatica de contadores sao excecoes separadas autorizadas. Preserve todos os demais dados. Nao modifique SHA-256. Ajuste contadores nao hash somente se exigidos pelo contrato. Grave e valide PT-BR ANTES de iniciar os especialistas; se houver erro, interrompa e reporte.
5. Entregue aos tres especialistas o manifesto deduplicado global (intentionIds e examples com intentionId/exampleId) e exija ausencia desses registros durante toda a execucao/retries. Nunca recrie IDs excluidos, inclusive ao gerar exemplos para arrays que ficaram vazios. Registre o manifesto de IDs de intencoes e IDs de exemplos criados no pre-pass. Entregue-o aos tres especialistas para traducao obrigatoria dos 3 exemplos, mesmo se a intencao ja existir no destino. Use os mesmos IDs, sem hqImage e sem duplicar em reexecucoes. Exemplos historicamente ausentes nos destinos continuam nao bloqueantes.
6. Delegue em paralelo a hashmap_en_us, hashmap_es_es e hashmap_fr_fr, cada um com arquivo de destino exclusivo. Se o runtime nao suportar subagentes, informe isso; nao finja que foram executados.
7. Para cada destino, crie/traduza apenas intencoes realmente ausentes e aplique atualizacoes incrementais seguras e justificadas. Traduza campos linguísticos conforme o idioma do destino, incluindo intention, description, tags e demais campos de linguagem quando aplicavel. Tags sao termos localizados: por exemplo, PT-BR 'diversao' corresponde a EN-US 'fun'. NAO exija igualdade literal de tags entre idiomas nem copie tags PT-BR sem traducao.
8. Exemplos excedentes nos destinos sao permitidos: ignore-os como divergencia bloqueante e preserve-os integralmente. Nenhum registro pode ser excluido automaticamente, exceto por marcacao explicita deleteItem === true identificada e validada pelo root. Preserve somente os registros nao excluidos pelo manifesto. IDs de exemplos divergentes e exemplos ausentes sao pendencias nao bloqueantes; nao os reconcilie, renomeie, duplique ou recrie automaticamente nesta execucao, EXCETO os 3 exemplos NOVOS do manifesto criado no pre-pass, que devem ser traduzidos em todos os destinos.
9. hqImage e estritamente local a cada idioma. Nunca copie hqImage de PT-BR ou de outro destino, nunca apague nem sobrescreva hqImage em registros sobreviventes. Exclusoes validadas removem seus campos JSON, nunca arquivos fisicos. Novos exemplos nao recebem hqImage automaticamente. Nao gere imagens.
10. Ignore divergencias de SHA-256 em metadata.integrity: nao use hashes como criterio de bloqueio, nao recalcule nem altere os hashes nesta execucao. Valide estrutura, IDs de intencao, metadados essenciais, JSON e compilacao de regex pelo motor real, sem tratar diferencas semanticas de regex como verificadas apenas por compilacao.
11. Aguarde as tres respostas e valide os arquivos modificados, incluindo preservacao dos hqImage locais. Se algum idioma falhar, inclusive ao propagar os 3 exemplos novos do manifesto, reporte falha parcial e identifique os demais resultados; nao declare sincronizacao global completa.
12. Alteracao da fonte somente por exclusoes globais validadas, correcao de totalIntentions ou pre-pass de arrays vazios sobreviventes. Teste a referencia exata em fixtures temporarias: marcacoes nos quatro idiomas, orfaos, multiplas marcas, precedencia, preservacao, nao recriacao, idempotencia e falhas/rollback. Confirme ausencia de marcacoes processadas e identidades excluidas apos os especialistas. Sem commit/push automatico; nao execute exclusoes reais apenas para testar.
13. Forneca relatorio inicial com quantas intencoes PT-BR vazias receberam 3 exemplos e seus IDs; por idioma: novas intencoes, campos traduzidos/alterados, exemplos excedentes preservados, exemplos ausentes/IDs divergentes adiados, regex invalidas, validacao estrutural, hqImage preservados e arquivos alterados. Inclua por idioma intencoes/exemplos excluidos (incluindo filhos sem dupla contagem), marcacoes orfas processadas, ausencias ignoradas, contadores corrigidos e criacoes/atualizacoes posteriores. Informe backup e arquivos nao restaurados. Inclua resultado de git diff --check. Nao apresente SHA-256 como requisito de aprovacao.
14. Ao finalizar, identifique processos na porta 5173 e encerre SOMENTE Vite escutando nela. Verifique e reporte a liberacao; nao reinicie. Preserve outros servicos e reporte bloqueio se algum deles ocupar a porta.
"""
