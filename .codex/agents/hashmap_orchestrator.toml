name = "hashmap_orchestrator"
description = "Planning and coordination policy for the root Codex session syncing pt-BR Mental Hashmap to en-US, es-ES and fr-FR. Do not spawn this role as a child."
developer_instructions = """
Voce descreve o papel do ORQUESTRADOR RAIZ. IMPORTANTE: este TOML documenta a funcao, mas a delegacao REAL deve ocorrer na sessao principal Codex, seguindo o AGENTS.md do projeto. NAO inicie este agente como subagente para delegar a outros: a profundidade de subagentes pode impedir isso.

Objetivo: sincronizar incrementalmente public/sample-hashmap-pt-BR.json (fonte unica de verdade) para os tres arquivos de idioma, permitindo alterar PT-BR SOMENTE para preencher examples: [] com tres exemplos canonicos antes da delegacao; nao apagar conteudo valido dos destinos.

1. Inspecione a implementacao atual de carregamento, schema e regex antes de escrever. Nao introduza backend, banco de dados, cache ou infraestrutura nova.
2. Valide a fonte: JSON parseavel, IDs de intencao unicos, IDs de exemplos unicos por intencao e sem conflitos globais se o app exigir unicidade global.
3. Compare IDs de intencoes PT-BR e destinos. Use um baseline Git explicito para identificar alteracoes na fonte. Sem baseline confiavel, nao sobrescreva traducoes existentes em massa. Preserve traducoes corretas e campos opcionais/desconhecidos.
4. PRE-PASS OBRIGATORIO ANTES DOS SUBAGENTES: percorra TODAS as intencoes PT-BR e localize arrays explicitamente vazios `examples: []`. Para CADA intencao assim, crie EXATAMENTE 3 exemplos diferentes, naturais em pt-BR e semanticamente coerentes, seguindo o schema existente: cada um com ID UUID novo e unico, exampleItem em portugues e intent como trecho literal presente em exampleItem. Nao inclua hqImage. Nao adicione exemplos a arrays ja nao vazios. Esta e a UNICA excecao de escrita no arquivo PT-BR; preserve todos os demais dados. Nao modifique SHA-256. Ajuste contadores nao hash somente se exigidos pelo contrato. Grave e valide PT-BR ANTES de iniciar os especialistas; se houver erro, interrompa e reporte.
5. Registre o manifesto de IDs de intencoes e IDs de exemplos criados no pre-pass. Entregue-o aos tres especialistas para traducao obrigatoria dos 3 exemplos, mesmo se a intencao ja existir no destino. Use os mesmos IDs, sem hqImage e sem duplicar em reexecucoes. Exemplos historicamente ausentes nos destinos continuam nao bloqueantes.
6. Delegue em paralelo a hashmap_en_us, hashmap_es_es e hashmap_fr_fr, cada um com arquivo de destino exclusivo. Se o runtime nao suportar subagentes, informe isso; nao finja que foram executados.
7. Para cada destino, crie/traduza apenas intencoes realmente ausentes e aplique atualizacoes incrementais seguras e justificadas. Traduza campos linguísticos conforme o idioma do destino, incluindo intention, description, tags e demais campos de linguagem quando aplicavel. Tags sao termos localizados: por exemplo, PT-BR 'diversao' corresponde a EN-US 'fun'. NAO exija igualdade literal de tags entre idiomas nem copie tags PT-BR sem traducao.
8. Exemplos excedentes nos destinos sao permitidos: ignore-os como divergencia bloqueante e preserve-os integralmente. Nao exclua exemplos ou intencoes. IDs de exemplos divergentes e exemplos ausentes sao pendencias nao bloqueantes; nao os reconcilie, renomeie, duplique ou recrie automaticamente nesta execucao, EXCETO os 3 exemplos NOVOS do manifesto criado no pre-pass, que devem ser traduzidos em todos os destinos.
9. hqImage e estritamente local a cada idioma. Nunca copie hqImage de PT-BR ou de outro destino, nunca apague nem sobrescreva hqImage existente. Novos exemplos nao recebem hqImage automaticamente. Nao gere imagens.
10. Ignore divergencias de SHA-256 em metadata.integrity: nao use hashes como criterio de bloqueio, nao recalcule nem altere os hashes nesta execucao. Valide estrutura, IDs de intencao, metadados essenciais, JSON e compilacao de regex pelo motor real, sem tratar diferencas semanticas de regex como verificadas apenas por compilacao.
11. Aguarde as tres respostas e valide os arquivos modificados, incluindo preservacao dos hqImage locais. Se algum idioma falhar, inclusive ao propagar os 3 exemplos novos do manifesto, reporte falha parcial e identifique os demais resultados; nao declare sincronizacao global completa.
12. Sem exclusao automatica; alteracao da fonte SOMENTE no pre-pass autorizado de examples: []; sem commit automatico e sem comandos Git destrutivos.
13. Forneca relatorio inicial com quantas intencoes PT-BR vazias receberam 3 exemplos e seus IDs; por idioma: novas intencoes, campos traduzidos/alterados, exemplos excedentes preservados, exemplos ausentes/IDs divergentes adiados, regex invalidas, validacao estrutural, hqImage preservados e arquivos alterados. Inclua resultado de git diff --check. Nao apresente SHA-256 como requisito de aprovacao.
"""
