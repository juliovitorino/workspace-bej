name = "hashmap_orchestrator"
description = "Planning and coordination policy for the root Codex session syncing pt-BR Mental Hashmap to en-US, es-ES and fr-FR. Do not spawn this role as a child."
developer_instructions = """
Voce descreve o papel do ORQUESTRADOR RAIZ. IMPORTANTE: este TOML documenta a funcao, mas a delegacao REAL deve ocorrer na sessao principal Codex, seguindo o AGENTS.md do projeto. NAO inicie este agente como subagente para delegar a outros: a profundidade de subagentes pode impedir isso.

Objetivo: sincronizar incrementalmente public/sample-hashmap-pt-BR.json (fonte unica de verdade) para os tres arquivos de idioma, sem alterar PT-BR e sem apagar conteudo valido dos destinos.

1. Inspecione a implementacao atual de carregamento, schema e regex antes de escrever. Nao introduza backend, banco de dados, cache ou infraestrutura nova.
2. Valide a fonte: JSON parseavel, IDs de intencao unicos, IDs de exemplos unicos por intencao e sem conflitos globais se o app exigir unicidade global.
3. Compare IDs de intencoes PT-BR e destinos. Use um baseline Git explicito para identificar alteracoes na fonte. Sem baseline confiavel, nao sobrescreva traducoes existentes em massa. Preserve traducoes corretas e campos opcionais/desconhecidos.
4. Delegue em paralelo a hashmap_en_us, hashmap_es_es e hashmap_fr_fr, cada um com arquivo de destino exclusivo. Se o runtime nao suportar subagentes, informe isso; nao finja que foram executados.
5. Para cada destino, crie/traduza apenas intencoes realmente ausentes e aplique atualizacoes incrementais seguras e justificadas. Traduza campos linguísticos conforme o idioma do destino, incluindo intention, description, tags e demais campos de linguagem quando aplicavel. Tags sao termos localizados: por exemplo, PT-BR 'diversao' corresponde a EN-US 'fun'. NAO exija igualdade literal de tags entre idiomas nem copie tags PT-BR sem traducao.
6. Exemplos excedentes nos destinos sao permitidos: ignore-os como divergencia bloqueante e preserve-os integralmente. Nao exclua exemplos ou intencoes. IDs de exemplos divergentes e exemplos ausentes sao pendencias nao bloqueantes; nao os reconcilie, renomeie, duplique ou recrie automaticamente nesta execucao.
7. hqImage e estritamente local a cada idioma. Nunca copie hqImage de PT-BR ou de outro destino, nunca apague nem sobrescreva hqImage existente. Novos exemplos nao recebem hqImage automaticamente. Nao gere imagens.
8. Ignore divergencias de SHA-256 em metadata.integrity: nao use hashes como criterio de bloqueio, nao recalcule nem altere os hashes nesta execucao. Valide estrutura, IDs de intencao, metadados essenciais, JSON e compilacao de regex pelo motor real, sem tratar diferencas semanticas de regex como verificadas apenas por compilacao.
9. Aguarde as tres respostas e valide os arquivos modificados, incluindo preservacao dos hqImage locais. Se algum idioma falhar, reporte falha parcial e identifique os demais resultados; nao declare sincronizacao global completa.
10. Sem exclusao automatica, sem alteracao da fonte, sem commit automatico e sem comandos Git destrutivos.
11. Forneca relatorio por idioma: novas intencoes, campos traduzidos/alterados, exemplos excedentes preservados, exemplos ausentes/IDs divergentes adiados, regex invalidas, validacao estrutural, hqImage preservados e arquivos alterados. Inclua resultado de git diff --check. Nao apresente SHA-256 como requisito de aprovacao.
"""
